<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Read My City</title>
<link rel="stylesheet" href="https://unpkg.com/maplibre-gl@4/dist/maplibre-gl.css">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<main>
  <div id="map"></div>

  <div id="search-card" class="search-card">
    <div class="search-card-header">
      <h1>Read My City</h1>
      <button id="search-card-toggle" class="search-card-toggle" type="button" aria-expanded="true" aria-controls="search-card-body">しまう</button>
    </div>
    <div id="search-card-body" class="search-card-body">
      <p class="subtitle">OSMデータで自分のまちを60秒でマッピング</p>
      <p class="meta-links"><a href="osm-about.html" target="_blank" rel="noopener">※OSMデータとは</a><span aria-hidden="true">｜</span><a href="about.html" target="_blank" rel="noopener">このサイトについて</a></p>
      <p class="data-note">地図上に出る要素の量や種類は、地域ごとのOSMデータの充実度によって異なります。</p>
      <form id="city-form" class="city-form">
        <input id="city-input" type="text" placeholder="市区町村名（例: 盛岡市）" autocomplete="off">
        <button type="submit">表示</button>
      </form>
      <p id="status-message" class="status-message"></p>
      <div class="basemap-toggle">
        <button class="basemap-btn" data-basemap="std">地図</button>
        <button class="basemap-btn active" data-basemap="photo">航空写真</button>
      </div>
    </div>
  </div>

  <div id="photo-note" class="photo-note">航空写真: 地理院タイル（撮影時期は地域により異なります）</div>

  <div id="loading-overlay" class="loading-overlay" hidden>
    <div class="loading-box">
      <span class="spinner"></span>
      <span id="loading-text">読み込み中です…</span>
    </div>
  </div>

  <button id="btn-fetch" class="refetch-btn" hidden>この範囲のOSMデータを取得</button>

  <div id="crop-frame" class="crop-frame" hidden></div>

  <div id="zoom-warning-overlay" class="zoom-warning-overlay" hidden>
    <div class="zoom-warning-box">
      <p id="zoom-warning-text"></p>
      <button id="btn-return-to-hub">元の表示に戻す</button>
    </div>
  </div>

  <div id="overlay-panel" class="overlay-panel" hidden>
    <div class="claim-buttons">
      <button class="claim-btn" id="btn-place">①プレイス性</button>
      <button class="claim-btn" id="btn-mobility">②回遊性</button>
      <button class="claim-btn" id="btn-access">③アクセス性</button>
      <button class="claim-btn" id="btn-car">④車が占める場所</button>
    </div>
    <div class="catalog-panel">
      <p class="catalog-panel-title">個別レイヤ（要素カタログ）</p>
      <div id="catalog-checkboxes" class="catalog-checkboxes"></div>
    </div>
    <p id="lens-message" class="lens-message">
      <span id="lens-message-text"></span>
    </p>
    <div class="export-buttons">
      <button id="btn-export-excel" disabled>Excelでダウンロード</button>
      <button id="btn-export-png">画像で保存</button>
    </div>
  </div>

  <div id="legend-panel" class="legend-panel" hidden>
    <p class="legend-title">凡例</p>
    <div id="legend-entries"></div>
  </div>
</main>

<script src="https://unpkg.com/maplibre-gl@4/dist/maplibre-gl.js"></script>
<script src="https://unpkg.com/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<script src="https://unpkg.com/@turf/turf@7/turf.min.js"></script>
<script type="module" src="src/main.js"></script>
</body>
</html>
